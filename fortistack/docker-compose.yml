version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fortistack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fortistaticpassword}
      POSTGRES_DB: ${POSTGRES_DB:-fortistack}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Optionally initialize with init.sql if needed, but we do migrations separately
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fortistack}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      DB_DSN: ${DB_DSN}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      ACCESS_TOKEN_TTL_MIN: ${ACCESS_TOKEN_TTL_MIN:-15}
      REFRESH_TOKEN_TTL_HOURS: ${REFRESH_TOKEN_TTL_HOURS:-168}
      REPORT_WORKDIR: ${REPORT_WORKDIR:-/app/reports}
      API_BASE_URL: ${API_BASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./reports_volume:/app/reports

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    environment:
      DB_DSN: ${DB_DSN}
      MONTHLY_CRON: ${MONTHLY_CRON:-"0 0 1 * *"}
      CRON_TZ: ${CRON_TZ:-Africa/Lagos}
      REPORT_WORKDIR: ${REPORT_WORKDIR:-/app/reports}
      API_BASE_URL: ${API_BASE_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./reports_volume:/app/reports

volumes:
  pgdata:
  reports_volume: # Shared volume for PDFs? API needs to serve what worker creates.
    # Yes, API serves download, Worker creates monthly reports.
    # If they are on same host, bind mount `./reports_volume` works.
    # In cloud (ECS/K8s), use EFS/S3.
    # Locally, bind mount works fine.

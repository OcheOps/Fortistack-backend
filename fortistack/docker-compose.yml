version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: fortistack
      POSTGRES_PASSWORD: fortistaticpassword
      POSTGRES_DB: fortistack
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      # Optionally initialize with init.sql if needed, but we do migrations separately
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fortistack"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      DB_DSN: "postgres://fortistack:fortistaticpassword@postgres:5432/fortistack?sslmode=disable"
      JWT_SECRET: "dev_secret_only"
      JWT_ISSUER: "fortistack"
      ACCESS_TOKEN_TTL_MIN: 15
      REFRESH_TOKEN_TTL_HOURS: 168
      REPORT_WORKDIR: "/app/reports"
      API_BASE_URL: "http://localhost:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./reports_volume:/app/reports

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    environment:
      DB_DSN: "postgres://fortistack:fortistaticpassword@postgres:5432/fortistack?sslmode=disable"
      MONTHLY_CRON: "0 0 1 * *" # Midnight first of month
      CRON_TZ: "Africa/Lagos"
      REPORT_WORKDIR: "/app/reports"
      API_BASE_URL: "http://localhost:8080"
      SMTP_HOST: "smtp.example.com"
      SMTP_PORT: 587
      SMTP_USER: "user"
      SMTP_PASS: "pass"
      SMTP_FROM: "reports@fortistack.local"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./reports_volume:/app/reports

volumes:
  pgdata:
  reports_volume: # Shared volume for PDFs? API needs to serve what worker creates.
    # Yes, API serves download, Worker creates monthly reports.
    # If they are on same host, bind mount `./reports_volume` works.
    # In cloud (ECS/K8s), use EFS/S3.
    # Locally, bind mount works fine.

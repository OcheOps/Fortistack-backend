<div class="score-card">
    <div class="score-box" style="border-left: 5px solid #4CAF50;">
        <h3>Availability</h3>
        <p class="score-value">{{.Details.Score.Availability}}</p>
    </div>
    <div class="score-box" style="border-left: 5px solid #2196F3;">
        <h3>Backup</h3>
        <p class="score-value">{{.Details.Score.Backup}}</p>
    </div>
    <div class="score-box" style="border-left: 5px solid #F44336;">
        <h3>Security</h3>
        <p class="score-value">{{.Details.Score.Security}}</p>
    </div>
    <div class="score-box" style="border-left: 5px solid #FF9800;">
        <h3>Compliance</h3>
        <p class="score-value">{{.Details.Score.Compliance}}</p>
    </div>
    <div class="score-box" style="border-left: 5px solid #9C27B0;">
        <h3>Cost</h3>
        <p class="score-value">{{.Details.Score.Cost}}</p>
    </div>
</div>
